[package]
name = "fnote-shell"
version = "0.1.0"
description = "note&back desktop shell (Tauri)"
authors = ["fnote"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "fnote_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
